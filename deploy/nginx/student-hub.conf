# =============================================================================
# Student Hub —— Nginx 反向代理配置模板
# -----------------------------------------------------------------------------
# 拓扑：浏览器 / 小程序 / Flutter App
#          └──► Nginx :80（启用 HTTPS 后 :80 仅做 301，:443 终止 TLS）
#                  └──► Spring Boot  127.0.0.1:9000（server.port / SERVER_PORT）
#
# 本文件同时包含 upstream、map、server 三种指令，属于「http 上下文」配置：
#   - 推荐：复制为 /etc/nginx/conf.d/student-hub.conf（conf.d/*.conf 会被 nginx.conf 在
#           http{} 内自动 include）
#   - 或：在 /etc/nginx/nginx.conf 的 http{} 内写 include /绝对路径/student-hub.conf;
#   - 不要 include 到 server{} 内：会报 "upstream directive is not allowed here"。
#
# 使用前至少替换以下 TODO：
#   1) server_name                             —— 改成真实域名（或公网 IP / _）
#   2) upstream 端口 9000                      —— 必须与后端 SERVER_PORT 一致
#   3) 启用 HTTPS 时：按下方「HTTPS 启用指南」取消注释并填证书路径
# 详细部署步骤、验证命令与排错见同目录 README.md。
# =============================================================================

# -----------------------------------------------------------------------------
# 后端上游
#   端口必须与后端 server.port 一致：application.yaml 为 ${SERVER_PORT:9000}，
#   即 .env / docker-compose 里 SERVER_PORT=9000 时保持 9000 不变。
# -----------------------------------------------------------------------------
upstream student_hub_backend {
    server 127.0.0.1:9000;
    # 与后端保持长连接，减少高频 API 的 TCP/TLS 抖动；
    # 需配合下方 proxy_set_header Connection ""（否则每个请求都新建连接）。
    keepalive 32;
}

# -----------------------------------------------------------------------------
# WebSocket 升级头
#   Connection 只能按请求动态取值，不能写死 "upgrade"（普通 HTTP 会因此断开上游连接）：
#   有 Upgrade 头时取 upgrade，否则取 close。
# -----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # ---- 监听 ---------------------------------------------------------------
    # 保持 80 端口（首次部署 / 证书签发阶段使用）。启用 HTTPS 见下方指南。
    listen 80;
    listen [::]:80;

    server_name student-hub.example.com;   # TODO：改成真实域名或公网 IP
    server_tokens off;                     # 不暴露 nginx 版本号

    # ---- HTTPS 启用指南（三选一）--------------------------------------------
    # A. 最省事：保持本文件 80 端口不动，执行
    #      sudo certbot --nginx -d student-hub.example.com
    #    certbot 会自动改写 listen 为 443 ssl 并写入证书路径（自动备份原文件）。
    # B. 手工启用：把上面两行 listen 换成下面两行，并取消本段 ssl_* 注释：
    #      listen 443 ssl;
    #      listen [::]:443 ssl;
    #      http2 on;                        # nginx >= 1.25.1；旧版本改用 listen 443 ssl http2;
    #      ssl_certificate     /etc/nginx/certs/student-hub.fullchain.pem;   # TODO 证书链
    #      ssl_certificate_key /etc/nginx/certs/student-hub.key;             # TODO 私钥（勿提交仓库）
    #      ssl_protocols TLSv1.2 TLSv1.3;
    #      ssl_prefer_server_ciphers off;
    #      ssl_session_cache shared:SSL:10m;
    #      ssl_session_timeout 1d;
    #      add_header Strict-Transport-Security "max-age=31536000" always;   # 确认全站 HTTPS 后再开
    # C. 反向代理到已有网关：删掉本 server 的 listen，改成只保留 location 供上游 include。
    #
    # 启用 HTTPS 后，把文件末尾「HTTP → HTTPS 301」注释段一并启用。
    # -------------------------------------------------------------------------

    # 分享域名还需在 sailtrack.cn 的 HTTPS server 中引入相同规则。
    location ^~ /c/ {
        proxy_pass http://student_hub_backend;
    }
    location = /.well-known/assetlinks.json {
        proxy_pass http://student_hub_backend;
    }
    location = /share/index.html {
        proxy_pass http://student_hub_backend;
    }

    # ---- 上传体积 -----------------------------------------------------------
    # 管理端安装包上传：POST /api/admin/app-versions/{id}/package
    #   body 为原始字节流（application/octet-stream），后端上限 300MB
    #   （AppVersionService.MAX_PACKAGE_BYTES），故 Nginx 放到 320m。
    # 注意：Nginx 默认只有 1m，不改这里会导致上传直接返回 413。
    client_max_body_size 320m;
    # 大文件上行时单次读超时；默认 60s 对慢速上行偏紧
    client_body_timeout 300s;

    # ---- 安全响应头 ---------------------------------------------------------
    # 以下三行是 server 级默认值，会作用于所有 location。
    # 【重要】nginx 的 add_header 不跨级继承：只要某个 location 里又写了任何
    # add_header，server 级的这几行就不会再作用于该 location，需要在那里重复声明。
    # 本文件在 /api/ 与 SPA 入口两个 location 重复了这三行。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;        # 管理端 iframe 内嵌数据大屏（同源）
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- gzip（SSE 路径会单独 gzip off）------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;              # 被代理的响应也要压缩（默认 off）
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # ---- 反向代理公共设置（各 location 默认继承）----------------------------
    proxy_http_version 1.1;        # SSE / WebSocket / keepalive 的前提
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # 空 Connection 才能让 upstream keepalive 生效；/ws/ 内会改成 upgrade。
    proxy_set_header Connection        "";
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # 普通接口 120s：后端同步 AI 调用自身 read-timeout 就有 60s，留出余量避免踩线 504；
    # SSE 段单独放宽到 600s，WebSocket 段 3600s。
    proxy_read_timeout    120s;

    # =========================================================================
    # 1) SSE 流式接口：必须关闭缓冲 / 缓存 / 压缩
    #    否则 Nginx 会攒满缓冲区才下发，前端表现为「等很久后一次性出全文」。
    #    后端 SSE 生命周期上限 180s（SseEmitter(180_000L)），read_timeout 留足余量。
    # =========================================================================
    # App 端 AI 流式对话：POST /api/app/ai/conversations/{conversationId}/chat-stream
    #（该前缀下还有 /api/app/ai/speech/transcribe 等普通接口，关缓冲对它们无副作用）
    location /api/app/ai/ {
        proxy_pass http://student_hub_backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;                    # 压缩会引入额外缓冲，SSE 必须关
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 管理端 AI 流式测试：POST /api/admin/ai/chat-stream（精确路径，避免影响其他管理端 AI 接口）
    location = /api/admin/ai/chat-stream {
        proxy_pass http://student_hub_backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =========================================================================
    # 2) WebSocket：社区实时推送（后端注册路径 /ws/community）
    # =========================================================================
    location /ws/ {
        proxy_pass http://student_hub_backend;
        # 【注意】本 location 定义了 proxy_set_header，会切断 server 级继承，
        # 因此公共转发头必须在此重列一遍（漏掉会导致后端看到的 Host/IP 失真）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;    # 长连接：避免静默心跳间隔内被断开
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # =========================================================================
    # 3) 静态素材 / 签名文件：保留后端自带的 Cache-Control，不额外加头
    #    - /api/common/assets/**      后端已设 Cache-Control: public, max-age=604800
    #    - /api/common/files/view/**  后端已设 Cache-Control: private, max-age=1800
    #    两个前缀都比 /api/ 长，会优先命中；此处禁止 add_header，
    #    否则会额外追加一条 Cache-Control 造成「双重 Cache-Control」。
    # =========================================================================
    location /api/common/assets/ {
        proxy_pass http://student_hub_backend;
    }

    location /api/common/files/view/ {
        proxy_pass http://student_hub_backend;
    }

    # =========================================================================
    # 4) 普通 API：Nginx 不做任何中间缓存（SSE / 素材 / 签名文件已在上面单独处理）
    # =========================================================================
    location /api/ {
        proxy_pass http://student_hub_backend;
        proxy_cache off;
        # 重复安全头：本 location 定义了 add_header，server 级不再继承
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 强制客户端每次回源（后端数据实时性要求高）
        add_header Cache-Control "no-store" always;
    }

    # =========================================================================
    # 5) 管理台 / 数据大屏 SPA
    #    后端 AdminWebConfig 把 /admin、/admin/、/screen、/screen/ forward 到 index.html，
    #    /admin/index.html、/screen/index.html 是真正的入口文件。
    # =========================================================================

    # 入口 HTML：不缓存，保证发版后刷新即取到新入口（避免旧 index 引用已删除的 hash 资源）
    location ~ ^/(?:admin|screen)(?:/|/index\.html)?$ {
        proxy_pass http://student_hub_backend;
        # 重复安全头（原因同上）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 静态资源长缓存（30 天）；文件内容变更时请改文件名或加 ?v= 版本号
    # 用 expires 而非 add_header，可保持 server 级安全头的继承。
    location ~* ^/(?:admin|screen)/.+\.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        proxy_pass http://student_hub_backend;
        expires 30d;
    }

    # SPA 其余子路径（如前端路由 /admin/xxx）回源，由后端决定 200/404
    location /admin/ {
        proxy_pass http://student_hub_backend;
    }

    location /screen/ {
        proxy_pass http://student_hub_backend;
    }

    # =========================================================================
    # 6) 兜底：健康检查、Swagger、WebSocket 以外的其他路径统一回源
    # =========================================================================
    location / {
        proxy_pass http://student_hub_backend;
    }

    # ---- 可选：certbot --webroot 校验路径 -----------------------------------
    # 用 certbot --nginx 时不需要；用 --webroot 方式时取消注释（^~ 防止被正则 location 抢走）
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
}

# =============================================================================
# 可选：HTTP → HTTPS 301 跳转
# 启用 HTTPS（本文件 server 改为 443）后启用本段，让 80 只负责跳转。
# 与上面的 80 server 不能同时启用（端口冲突），二选一。
# =============================================================================
