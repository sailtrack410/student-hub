# 在 sailtrack.cn 现有 HTTPS server 内 include 本文件，保留站点其他 location。
# student_hub_backend upstream 与主配置一致；跨主机时改为实际后端地址。
location ^~ /c/ {
    proxy_pass http://student_hub_backend;
}
location = /.well-known/assetlinks.json {
    proxy_pass http://student_hub_backend;
}
location = /share/index.html {
    proxy_pass http://student_hub_backend;
}
