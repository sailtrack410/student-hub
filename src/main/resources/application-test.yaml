spring:
  datasource:
    url: jdbc:h2:mem:studenthub;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
  data:
    redis:
      repositories:
        enabled: false

studenthub:
  config:
    secret-key: test-only-config-secret-key-0123456789abcdef
  security:
    session-store: memory
    session-ttl: 8h
    password-login-enabled: true
    allowed-origins:
      - http://localhost:3000
  wechat:
    mode: mock
    default-campus-id: 1
  qq:
    # 测试固定 mock：.env 可能配置真实 QQ 凭证，不能让测试依赖外网
    mode: mock
    default-campus-id: 1
  ai:
    enabled: false
  rag:
    enabled: false
  file:
    storage: local
    storage-dir: target/test-files
    sign-secret: test-sign-secret
