spring:
  datasource:
    url: jdbc:h2:mem:studenthub;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
  data:
    redis:
      repositories:
        enabled: false

studenthub:
  security:
    session-store: memory
    session-ttl: 8h
    password-login-enabled: true
    allowed-origins:
      - http://localhost:3000
  wechat:
    mode: mock
    default-campus-id: 1
  ai:
    enabled: false
  rag:
    enabled: false
  file:
    storage: local
    storage-dir: target/test-files
    sign-secret: test-sign-secret
