server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: student-hub-api
  profiles:
    default: dev
  # 自动加载根目录未跟踪的 .env（KEY=VALUE 格式），IDE 直接启动无需先 source
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:student_hub}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 数据库在公网，中间有防火墙/NAT 会静默断开空闲连接：
      # 主动在超时前回收、并定期保活，避免池里残留“已关闭”的半死连接。
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 120000
      keepalive-time: 120000
      max-lifetime: 300000
  flyway:
    out-of-order: true
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:5}MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

studenthub:
  config:
    # 管理端配置中心敏感值落库加密主密钥（AES-256-GCM）。
    # 仅从环境变量读取，禁止写入仓库；为空时密钥类配置只能读取环境变量、不能在页面保存。
    secret-key: ${CONFIG_SECRET_KEY:}
  security:
    session-store: ${SESSION_STORE:memory}
    session-ttl: ${SESSION_TTL:8h}
    # App 端（x-client-type: app）走长期免登录；其余客户端用上面的 session-ttl
    app-session-ttl: ${APP_SESSION_TTL:30d}
    # 滑动续期阈值：App 会话剩余不足该值时刷新回完整 TTL，0 表示关闭续期
    session-renew-threshold: ${SESSION_RENEW_THRESHOLD:7d}
    app-client-header: ${APP_CLIENT_HEADER:x-client-type}
    app-client-value: ${APP_CLIENT_VALUE:app}
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:false}
    allowed-origins: ${ALLOWED_ORIGINS:}
  schedule-sync:
    enabled: ${SCHEDULE_SYNC_ENABLED:true}
    cron: ${SCHEDULE_SYNC_CRON:0 0 7-21/2 * * *}
    stagger-max-seconds: ${SCHEDULE_SYNC_STAGGER_MAX_SECONDS:30}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}
    max-input-characters: ${AI_MAX_INPUT_CHARACTERS:12000}
  amap:
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    connect-timeout-seconds: ${AMAP_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AMAP_READ_TIMEOUT_SECONDS:8}
  ai-chat:
    hourly-message-limit: ${AI_CHAT_HOURLY_MESSAGE_LIMIT:20}
    history-window: ${AI_CHAT_HISTORY_WINDOW:10}
    max-message-characters: ${AI_CHAT_MAX_MESSAGE_CHARACTERS:2000}
  rag:
    enabled: ${RAG_ENABLED:false}
    jdbc-url: ${RAG_DB_URL:jdbc:postgresql://localhost:5435/postgres}
    username: ${RAG_DB_USERNAME:}
    password: ${RAG_DB_PASSWORD:}
    max-document-size-mb: ${RAG_MAX_DOCUMENT_SIZE_MB:30}
    max-parsed-characters: ${RAG_MAX_PARSED_CHARACTERS:2000000}
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:16}
    lexical-candidate-limit: ${RAG_LEXICAL_CANDIDATE_LIMIT:40}
    vector-candidate-limit: ${RAG_VECTOR_CANDIDATE_LIMIT:40}
    lexical-min-similarity: ${RAG_LEXICAL_MIN_SIMILARITY:0.05}
    rrf-k: ${RAG_RRF_K:60}
  wechat:
    mode: ${WECHAT_MODE:real}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    api-base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com}
    default-campus-id: ${WECHAT_DEFAULT_CAMPUS_ID:1}
    connect-timeout-seconds: ${WECHAT_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${WECHAT_READ_TIMEOUT_SECONDS:10}
  qq:
    # QQ 互联「移动应用」审核通过前用 mock：不访问 QQ，凭 accessToken 派生稳定身份。
    # real 模式：服务端用 APP ID + openid + accessToken 调 get_user_info，校验 token 属于本应用；
    # 移动端 SDK 只需 QQ_CLIENT_ID，QQ_CLIENT_SECRET 仅预留网站授权码流程，不能下发客户端。
    mode: ${QQ_MODE:mock}
    client-id: ${QQ_CLIENT_ID:}
    client-secret: ${QQ_CLIENT_SECRET:}
    api-base-url: ${QQ_API_BASE_URL:https://graph.qq.com}
    default-campus-id: ${QQ_DEFAULT_CAMPUS_ID:1}
    connect-timeout-seconds: ${QQ_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${QQ_READ_TIMEOUT_SECONDS:10}
  mail:
    # 校园邮箱验证码真实发信。生产环境必须开启并配置 SMTP，未配置时接口明确返回 503，不会伪报已发送。
    # 465 常用 SSL；587 常用 STARTTLS（此时 MAIL_SSL_ENABLED=false、MAIL_STARTTLS_ENABLED=true）。
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:绵城一码通}
    ssl-enabled: ${MAIL_SSL_ENABLED:true}
    starttls-enabled: ${MAIL_STARTTLS_ENABLED:false}
    connect-timeout-ms: ${MAIL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MAIL_READ_TIMEOUT_MS:5000}
    write-timeout-ms: ${MAIL_WRITE_TIMEOUT_MS:5000}
    # 仅 dev/test profile 生效；生产 profile 即使误设 true 也不会返回验证码。
    dev-return-code: ${MAIL_DEV_RETURN_CODE:true}
  file:
    storage: ${FILE_STORAGE:local}
    storage-dir: ${FILE_STORAGE_DIR:./data/files}
    sign-secret: ${FILE_SIGN_SECRET:dev-sign-secret-change-me}
    max-file-size-mb: ${FILE_MAX_SIZE_MB:5}
    view-ttl-minutes: ${FILE_VIEW_TTL_MINUTES:30}
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # MinIO 对客户端公开的 HTTPS 地址；本地后端仍通过 MINIO_ENDPOINT 访问 MinIO
    minio-public-endpoint: ${MINIO_PUBLIC_ENDPOINT:https://student.sailtrack.cn}
    minio-access-key: ${MINIO_ACCESS_KEY:}
    minio-secret-key: ${MINIO_SECRET_KEY:}
    minio-bucket: ${MINIO_BUCKET:student-hub}
    oss-endpoint: ${OSS_ENDPOINT:}
    oss-public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    oss-bucket: ${OSS_BUCKET:}
    oss-access-key-id: ${OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  jw:
    sso-base-url: ${JW_SSO_BASE_URL:https://sso.mycc.edu.cn}
    jw-base-url: ${JW_JW_BASE_URL:https://jwgl.mycc.edu.cn}
    cas-service: ${JW_CAS_SERVICE:http://jwgl.mycc.edu.cn/caslogin}
    encrypt-key: ${JW_ENCRYPT_KEY:dev-jw-encrypt-key-change-me}
    session-ttl-hours: ${JW_SESSION_TTL_HOURS:48}
    connect-timeout-seconds: ${JW_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${JW_READ_TIMEOUT_SECONDS:15}
    auth-rate-limit-per-minute: ${JW_AUTH_RATE_LIMIT_PER_MINUTE:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true

knife4j:
  enable: true

logging:
  level:
    root: INFO
    com.studenthub: INFO
