<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:,">
  <title>校园动态 · 绵城码上办</title>
  <style>
    :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #12213c; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { width: min(100% - 48px, 1040px); margin: auto; padding: 28px 0; }
    header { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .04em; }
    .mark { display: inline-grid; place-items: center; width: 32px; height: 32px; background: #2563eb; color: white; border-radius: 10px; }
    main { width: min(100% - 48px, 520px); margin: auto; padding: 64px 0 80px; }
    .eyebrow { display: flex; gap: 10px; align-items: center; color: #526582; font-size: 13px; letter-spacing: .12em; }
    .eyebrow::before { content: ""; width: 24px; height: 2px; background: #2563eb; }
    h1 { margin: 24px 0 18px; font-size: clamp(34px, 7vw, 48px); line-height: 1.3; letter-spacing: -.035em; font-weight: 700; }
    p { max-width: 30em; margin: 0; color: #526582; font-size: 16px; line-height: 1.9; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
    a { display: inline-flex; justify-content: center; align-items: center; min-height: 50px; padding: 0 28px; border: 1px solid #cdd7e7; border-radius: 12px; color: #213b62; text-decoration: none; font-size: 15px; font-weight: 600; }
    a.primary { color: white; background: #2563eb; border-color: #2563eb; }
    a:hover { border-color: #2563eb; }
    a:focus-visible { outline: 3px solid #93b9ff; outline-offset: 4px; }
    .hint { margin-top: 24px; font-size: 13px; color: #64748b; }
    footer { border-top: 1px solid #dce3ef; font-size: 12px; color: #64748b; }
    @media (max-width: 420px) { nav { flex-direction: column; } nav a { width: 100%; } main { padding-top: 40px; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><span class="mark" aria-hidden="true">绵</span>绵城码上办</header>
  <main>
    <div class="eyebrow">校园社区</div>
    <h1 id="title">校园里的新鲜事，<br>打开一起看看。</h1>
    <p id="description">好友分享了一条校园动态。在 App 中查看完整内容，参与同学们的讨论。</p>
    <nav aria-label="打开分享内容">
      <a id="open-app" class="primary" hidden>打开 App <span aria-hidden="true">&nbsp;↗</span></a>
      <a href="https://mycc.sailtrack.cn/download/">下载 App</a>
    </nav>
    <p class="hint" id="hint">打开后如需登录，登录完成会继续进入这条动态。</p>
  </main>
  <footer>连接校园生活的每一天</footer>
  <script>
    const segments = location.pathname.split('/').filter(Boolean);
    const target = segments.length === 2 && segments[0] === 'c' ? segments[1] : '';
    if (/^[A-Za-z0-9]{1,19}$/.test(target)) {
      const link = document.getElementById('open-app');
      link.href = `studenthub://p/${encodeURIComponent(target)}`;
      link.hidden = false;
    } else {
      document.getElementById('title').textContent = '分享链接无效';
      document.getElementById('description').textContent = '请向分享者获取完整链接，也可以打开 App 浏览校园社区。';
      document.getElementById('hint').hidden = true;
    }
  </script>
</body>
</html>
