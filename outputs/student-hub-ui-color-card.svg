<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "STHeiti", "PingFang SC", "Helvetica Neue", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#F8FAFC"/>
  <rect x="64" y="60" width="1472" height="1080" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>

  <g class="sans" fill="#0F172A">
    <text x="112" y="132" font-size="22" font-weight="700" letter-spacing="3">STUDENT HUB / UI COLOR SYSTEM</text>
    <text x="112" y="188" font-size="48" font-weight="800">学生自助平台 · 产品色卡</text>
    <text x="112" y="228" font-size="20" fill="#64748B">一套面向学习、服务与校园协作场景的清晰色彩语言</text>
  </g>

  <g class="sans">
    <text x="112" y="304" font-size="18" font-weight="700" fill="#64748B" letter-spacing="2">BRAND COLORS</text>
    <rect x="112" y="332" width="440" height="470" rx="20" fill="#2563EB"/>
    <rect x="142" y="362" width="380" height="280" rx="14" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="226" cy="443" r="42" fill="#FFFFFF" opacity="0.96"/>
    <path d="M205 446h42M226 425v42" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <text x="142" y="704" font-size="28" font-weight="700" fill="#FFFFFF">主色 / Primary</text>
    <text x="142" y="752" font-size="32" class="mono" fill="#FFFFFF">#2563EB</text>
    <text x="142" y="783" font-size="18" fill="#DBEAFE">导航、主按钮、链接、关键操作</text>

    <rect x="576" y="332" width="420" height="224" rx="20" fill="#0F766E"/>
    <text x="610" y="416" font-size="26" font-weight="700" fill="#FFFFFF">辅助色 / Secondary</text>
    <text x="610" y="470" font-size="30" class="mono" fill="#CCFBF1">#0F766E</text>
    <text x="610" y="512" font-size="18" fill="#CCFBF1">分类、辅助入口、校园服务</text>
    <rect x="1018" y="332" width="420" height="224" rx="20" fill="#14B8A6"/>
    <text x="1052" y="416" font-size="26" font-weight="700" fill="#042F2E">强调色 / Accent</text>
    <text x="1052" y="470" font-size="30" class="mono" fill="#042F2E">#14B8A6</text>
    <text x="1052" y="512" font-size="18" fill="#115E59">选中态、进度、轻量强调</text>
  </g>

  <g class="sans">
    <text x="576" y="616" font-size="18" font-weight="700" fill="#64748B" letter-spacing="2">STATUS COLORS</text>
    <rect x="576" y="646" width="260" height="156" rx="16" fill="#16A34A"/>
    <text x="604" y="704" font-size="24" font-weight="700" fill="#FFFFFF">成功</text>
    <text x="604" y="750" font-size="24" class="mono" fill="#DCFCE7">#16A34A</text>
    <rect x="864" y="646" width="260" height="156" rx="16" fill="#D97706"/>
    <text x="892" y="704" font-size="24" font-weight="700" fill="#FFFFFF">警告</text>
    <text x="892" y="750" font-size="24" class="mono" fill="#FEF3C7">#D97706</text>
    <rect x="1152" y="646" width="286" height="156" rx="16" fill="#DC2626"/>
    <text x="1180" y="704" font-size="24" font-weight="700" fill="#FFFFFF">错误</text>
    <text x="1180" y="750" font-size="24" class="mono" fill="#FEE2E2">#DC2626</text>
  </g>

  <g class="sans">
    <text x="112" y="870" font-size="18" font-weight="700" fill="#64748B" letter-spacing="2">TEXT &amp; SURFACE</text>
    <rect x="112" y="900" width="280" height="150" rx="16" fill="#0F172A"/>
    <text x="140" y="958" font-size="23" font-weight="700" fill="#FFFFFF">主文字</text>
    <text x="140" y="1002" font-size="22" class="mono" fill="#CBD5E1">#0F172A</text>
    <rect x="420" y="900" width="280" height="150" rx="16" fill="#64748B"/>
    <text x="448" y="958" font-size="23" font-weight="700" fill="#FFFFFF">次文字</text>
    <text x="448" y="1002" font-size="22" class="mono" fill="#E2E8F0">#64748B</text>
    <rect x="728" y="900" width="280" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="756" y="958" font-size="23" font-weight="700" fill="#0F172A">页面背景</text>
    <text x="756" y="1002" font-size="22" class="mono" fill="#64748B">#F8FAFC</text>
    <rect x="1036" y="900" width="180" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1064" y="958" font-size="23" font-weight="700" fill="#0F172A">卡片</text>
    <text x="1064" y="1002" font-size="19" class="mono" fill="#64748B">#FFFFFF</text>
    <rect x="1244" y="900" width="194" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
    <text x="1272" y="958" font-size="23" font-weight="700" fill="#0F172A">边框</text>
    <text x="1272" y="1002" font-size="19" class="mono" fill="#64748B">#E2E8F0</text>
  </g>

  <text x="112" y="1092" class="sans" font-size="16" fill="#94A3B8">Recommended usage: accessible contrast · calm campus tone · clear interaction states</text>
</svg>
