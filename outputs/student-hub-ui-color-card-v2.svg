<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "STHeiti", "PingFang SC", "Helvetica Neue", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1px; }
  </style>
  <rect width="1600" height="1000" fill="#F8FAFC"/>
  <rect x="72" y="64" width="1456" height="872" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <text x="120" y="148" class="sans" font-size="40" font-weight="800" fill="#0F172A">学生自助平台 · UI 色卡</text>

  <text x="120" y="232" class="sans" font-size="16" font-weight="700" fill="#64748B" letter-spacing="2">品牌色</text>
  <g class="sans">
    <rect x="120" y="260" width="400" height="184" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="120" y="260" width="400" height="60" rx="16" fill="#2563EB"/>
    <text x="146" y="317" font-size="20" font-weight="700" fill="#FFFFFF">主色</text>
    <text x="146" y="390" class="mono" font-size="23" fill="#1D4ED8">#2563EB</text>

    <rect x="560" y="260" width="400" height="184" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/>
    <rect x="560" y="260" width="400" height="60" rx="16" fill="#0F766E"/>
    <text x="586" y="317" font-size="20" font-weight="700" fill="#FFFFFF">辅助色</text>
    <text x="586" y="390" class="mono" font-size="23" fill="#0F766E">#0F766E</text>

    <rect x="1000" y="260" width="400" height="184" rx="16" fill="#ECFEFF" stroke="#99F6E4" stroke-width="2"/>
    <rect x="1000" y="260" width="400" height="60" rx="16" fill="#14B8A6"/>
    <text x="1026" y="317" font-size="20" font-weight="700" fill="#042F2E">强调色</text>
    <text x="1026" y="390" class="mono" font-size="23" fill="#0F766E">#14B8A6</text>
  </g>

  <text x="120" y="518" class="sans" font-size="16" font-weight="700" fill="#64748B" letter-spacing="2">状态色</text>
  <g class="sans">
    <rect x="120" y="546" width="400" height="142" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
    <rect x="120" y="546" width="400" height="12" rx="6" fill="#16A34A"/>
    <text x="146" y="612" font-size="20" font-weight="700" fill="#166534">成功</text>
    <text x="146" y="656" class="mono" font-size="19" fill="#16A34A">#16A34A</text>
    <rect x="560" y="546" width="400" height="142" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
    <rect x="560" y="546" width="400" height="12" rx="6" fill="#D97706"/>
    <text x="586" y="612" font-size="20" font-weight="700" fill="#92400E">警告</text>
    <text x="586" y="656" class="mono" font-size="19" fill="#D97706">#D97706</text>
    <rect x="1000" y="546" width="400" height="142" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
    <rect x="1000" y="546" width="400" height="12" rx="6" fill="#DC2626"/>
    <text x="1026" y="612" font-size="20" font-weight="700" fill="#991B1B">错误</text>
    <text x="1026" y="656" class="mono" font-size="19" fill="#DC2626">#DC2626</text>
  </g>

  <text x="120" y="758" class="sans" font-size="16" font-weight="700" fill="#64748B" letter-spacing="2">文字与基础</text>
  <g class="sans">
    <rect x="120" y="786" width="246" height="78" rx="14" fill="#0F172A"/>
    <text x="146" y="819" font-size="17" font-weight="700" fill="#FFFFFF">主文字</text>
    <text x="146" y="846" class="mono" font-size="15" fill="#CBD5E1">#0F172A</text>
    <rect x="390" y="786" width="246" height="78" rx="14" fill="#64748B"/>
    <text x="416" y="819" font-size="17" font-weight="700" fill="#FFFFFF">次文字</text>
    <text x="416" y="846" class="mono" font-size="15" fill="#E2E8F0">#64748B</text>
    <rect x="660" y="786" width="246" height="78" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="686" y="819" font-size="17" font-weight="700" fill="#0F172A">页面背景</text>
    <text x="686" y="846" class="mono" font-size="15" fill="#64748B">#F8FAFC</text>
    <rect x="930" y="786" width="246" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="956" y="819" font-size="17" font-weight="700" fill="#0F172A">卡片背景</text>
    <text x="956" y="846" class="mono" font-size="15" fill="#64748B">#FFFFFF</text>
    <rect x="1200" y="786" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
    <text x="1226" y="819" font-size="17" font-weight="700" fill="#0F172A">边框</text>
    <text x="1226" y="846" class="mono" font-size="15" fill="#64748B">#E2E8F0</text>
  </g>
</svg>
